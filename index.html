<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>an arcade of my own</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-elev: #161616;
      --ink: #f5f1e8;
      --ink-dim: #8a857a;
      --accent: #c4ff3d;
      --line: #2a2a2a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 4rem 2rem;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(196,255,61,0.06), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(196,255,61,0.03), transparent 50%);
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 2rem;
      margin-bottom: 4rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-size: clamp(2.75rem, 9vw, 6.5rem);
      letter-spacing: -0.04em;
      line-height: 0.92;
      font-style: italic;
      font-variation-settings: "opsz" 144;
    }
    .title em {
      font-style: normal;
      color: var(--accent);
      font-weight: 500;
    }
    .meta {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-dim);
      text-align: right;
    }
    .meta strong {
      color: var(--accent);
      display: block;
      font-size: 13px;
      margin-bottom: 0.4rem;
      letter-spacing: 0.1em;
    }
    .games { list-style: none; }
    .game {
      border-bottom: 1px solid var(--line);
      padding: 2rem 0;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 2rem;
      align-items: center;
      transition: padding 0.25s ease, background 0.25s ease;
    }
    .game:hover {
      background: var(--bg-elev);
      margin: 0 -2rem;
      padding: 2rem;
    }
    .game .num {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2.25rem;
      color: var(--ink-dim);
      font-style: italic;
      font-weight: 300;
    }
    .game:hover .num { color: var(--accent); }
    .game .info h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      line-height: 1.1;
    }
    .game .info p {
      color: var(--ink-dim);
      font-size: 13px;
      max-width: 500px;
    }
    .game .play {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--bg);
      background: var(--accent);
      padding: 0.85rem 1.6rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
      white-space: nowrap;
    }
    .game .play:hover {
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0 var(--ink);
    }
    .empty {
      padding: 4rem 0;
      text-align: center;
      color: var(--ink-dim);
      font-style: italic;
      font-family: 'Fraunces', Georgia, serif;
    }
    footer {
      margin-top: 6rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { color: var(--accent); border-color: var(--accent); }
    @media (max-width: 640px) {
      body { padding: 2.5rem 1.25rem; }
      .game { grid-template-columns: auto 1fr; gap: 1rem 1.25rem; }
      .game .play { grid-column: 1 / -1; justify-self: start; margin-top: 0.5rem; }
      .game:hover { margin: 0 -1.25rem; padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="title">an arcade<br>of <em>my own</em>.</h1>
      <div class="meta">
        <strong>03 games</strong>
        last updated 2026.05.04
      </div>
    </header>
    <ul class="games">
        <li class="game">
          <span class="num">01</span>
          <div class="info">
            <h2>Jump Map - 점프맵 게임</h2>
          </div>
          <a class="play" href="./jumpmap/">play &rarr;</a>
        </li>
        <li class="game">
          <span class="num">02</span>
          <div class="info">
            <h2>멍멍이 점프 대모험!</h2>
          </div>
          <a class="play" href="./puppy-jump/">play &rarr;</a>
        </li>
        <li class="game">
          <span class="num">03</span>
          <div class="info">
            <h2>착시 현상 - Forced Perspective Game</h2>
          </div>
          <a class="play" href="./착시현상/">play &rarr;</a>
        </li>
    </ul>
    <footer>
      <span>made with bash + ❤</span>
      <span>2026</span>
    </footer>
  </div>
</body>
</html>
